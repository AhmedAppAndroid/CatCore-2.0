
# FIX: Coreboot 26.09 requires GCC 14+ for -std=gnu23.
# Replace the existing coreboot job with this job.
# Keep the engine, integration, and apk jobs unchanged.

  coreboot:
    name: Build Coreboot BIOS with SeaBIOS
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore Coreboot cache
        id: cache
        uses: actions/cache@v4
        with:
          path: firmware-out
          key: catcore-coreboot-26.09-r2-gcc14

      - name: Install Coreboot dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-14 \
            g++-14 \
            git \
            curl \
            ca-certificates \
            python3 \
            python3-pip \
            bison \
            flex \
            m4 \
            make \
            nasm \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            zlib1g-dev \
            uuid-dev \
            pkg-config \
            acpica-tools \
            wget \
            xz-utils

      - name: Build Coreboot BIOS
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch 26.09 \
            https://github.com/coreboot/coreboot.git \
            coreboot-src

          cd coreboot-src

          # Override GCC 13 with GCC 14.
          mkdir -p toolchain-bin

          ln -s /usr/bin/gcc-14 \
            toolchain-bin/x86_64-linux-gnu-gcc

          ln -s /usr/bin/g++-14 \
            toolchain-bin/x86_64-linux-gnu-g++

          export PATH="$PWD/toolchain-bin:$PATH"

          x86_64-linux-gnu-gcc --version

          # Check C23 support before building.
          printf 'int main(void) { return 0; }\n' | \
            x86_64-linux-gnu-gcc \
              -std=gnu23 \
              -x c \
              -fsyntax-only -

          cat > .config <<'CONFIG'
          CONFIG_VENDOR_EMULATION=y
          CONFIG_BOARD_EMULATION_QEMU_X86_I440FX=y
          CONFIG_ANY_TOOLCHAIN=y
          CONFIG_CBFS_SIZE=0x00400000
          CONFIG_CONSOLE_SERIAL=y
          CONFIG_PAYLOAD_SEABIOS=y
          CONFIG_SEABIOS_STABLE=y
          CONFIG_ROM_SIZE=0x400000
          CONFIG

          make olddefconfig

          grep -qx \
            'CONFIG_BOARD_EMULATION_QEMU_X86_I440FX=y' \
            .config

          grep -qx \
            'CONFIG_PAYLOAD_SEABIOS=y' \
            .config

          make -j "$(nproc)"

          test -s build/coreboot.rom

          mkdir -p ../firmware-out

          cp build/coreboot.rom \
            ../firmware-out/coreboot.rom

          sha256sum ../firmware-out/coreboot.rom

      - name: Verify Coreboot ROM
        shell: bash
        run: |
          set -euo pipefail

          test -s firmware-out/coreboot.rom
          ls -lh firmware-out/coreboot.rom

      - name: Upload Coreboot BIOS
        uses: actions/upload-artifact@v4
        with:
          name: catcore-coreboot-bios
          path: firmware-out/coreboot.rom
          if-no-files-found: error
          
