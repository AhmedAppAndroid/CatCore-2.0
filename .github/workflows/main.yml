
name: CatCore - Coreboot BIOS, QEMU, Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: catcore-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_VERSION: '9.2.0'
  ENGINE_REV: 'r5'
  COREBOOT_VERSION: '26.09'
  COREBOOT_REV: 'r1'

jobs:
  engine:
    name: Build QEMU ARM64 Engine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Restore QEMU cache
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out
          key: catcore-qemu-linux-arm64-${{ env.QEMU_VERSION }}-${{ env.ENGINE_REV }}

      - name: Create QEMU build script
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > build-engine.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          apk add --no-cache \
            build-base linux-headers binutils file \
            python3 py3-pip py3-setuptools py3-wheel \
            pkgconf curl ca-certificates tar xz git \
            meson ninja coreutils grep sed gawk \
            diffutils findutils \
            glib-dev glib-static pcre2-dev libffi-dev \
            zlib-dev zlib-static pixman-dev pixman-static \
            gettext-dev gettext-static dtc dtc-dev

          for lib in libglib-2.0.a libpixman-1.a libz.a libffi.a; do
            test -s "/usr/lib/$lib"
          done

          pkgconf --static --libs glib-2.0 pixman-1

          curl --retry 3 -fL \
            https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.8.0/libslirp-v4.8.0.tar.gz \
            -o /work/libslirp.tar.gz

          tar -xzf /work/libslirp.tar.gz -C /work

          (
            cd /work/libslirp-v4.8.0
            meson setup build \
              --prefix=/usr \
              --libdir=lib \
              --default-library=static
            ninja -C build install
          )

          pkgconf --static --libs slirp

          curl --retry 3 -fL \
            "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" \
            -o /work/qemu.tar.xz

          tar -xJf /work/qemu.tar.xz -C /work

          mkdir -p "/work/qemu-${QEMU_VERSION}/build"
          cd "/work/qemu-${QEMU_VERSION}/build"

          ../configure \
            --static \
            --target-list=x86_64-softmmu \
            --without-default-features \
            --disable-fdt \
            --enable-tcg \
            --enable-pixman \
            --enable-vnc \
            --enable-slirp \
            --disable-werror

          ninja qemu-system-x86_64
          strip -s qemu-system-x86_64

          if readelf -l qemu-system-x86_64 | grep -q INTERP; then
            echo 'ERROR: QEMU is not statically linked'
            exit 1
          fi

          mkdir -p /work/engine-out
          cp qemu-system-x86_64 \
            /work/engine-out/libqemu-system-x86_64.so

          chmod 755 \
            /work/engine-out/libqemu-system-x86_64.so
          SCRIPT

          chmod +x build-engine.sh

      - name: Build QEMU in Alpine ARM64
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-out

          docker run --rm \
            --platform linux/arm64 \
            -e QEMU_VERSION \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.21 \
            sh /work/build-engine.sh

      - name: Fix QEMU permissions and verify engine
        shell: bash
        run: |
          set -euo pipefail

          E=engine-out/libqemu-system-x86_64.so
          test -s "$E"

          sudo chown -R "$(id -u):$(id -g)" engine-out
          chmod 755 "$E"

          "$PWD/$E" --version
          "$PWD/$E" -device help > devices.txt

          for d in VGA nvme usb-tablet usb-kbd; do
            grep -Fq "name \"$d\"" devices.txt || {
              echo "Missing QEMU device: $d"
              exit 1
            }
          done

          "$PWD/$E" -netdev help > netdev.txt 2>&1 || true
          grep -qw user netdev.txt

      - name: Upload QEMU engine
        uses: actions/upload-artifact@v4
        with:
          name: catcore-qemu-engine
          path: engine-out/libqemu-system-x86_64.so
          if-no-files-found: error

  coreboot:
    name: Build Coreboot BIOS with SeaBIOS Payload
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore Coreboot cache
        id: cache
        uses: actions/cache@v4
        with:
          path: firmware-out
          key: catcore-coreboot-${{ env.COREBOOT_VERSION }}-${{ env.COREBOOT_REV }}

      - name: Install Coreboot dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates \
            python3 python3-pip \
            bison flex m4 make gcc g++ nasm \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            uuid-dev pkg-config acpica-tools wget xz-utils

      - name: Build Coreboot BIOS
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch "$COREBOOT_VERSION" \
            https://github.com/coreboot/coreboot.git \
            coreboot-src

          cd coreboot-src

          # Coreboot firmware with an embedded SeaBIOS payload.
          cat > .config <<'CONFIG'
          CONFIG_VENDOR_EMULATION=y
          CONFIG_BOARD_EMULATION_QEMU_X86_I440FX=y
          CONFIG_ANY_TOOLCHAIN=y
          CONFIG_CBFS_SIZE=0x00400000
          CONFIG_CONSOLE_SERIAL=y
          CONFIG_PAYLOAD_SEABIOS=y
          CONFIG_SEABIOS_STABLE=y
          CONFIG_ROM_SIZE=0x400000
          CONFIG

          make olddefconfig

          grep -qx \
            'CONFIG_BOARD_EMULATION_QEMU_X86_I440FX=y' .config

          grep -qx \
            'CONFIG_PAYLOAD_SEABIOS=y' .config

          grep -qx \
            'CONFIG_ANY_TOOLCHAIN=y' .config

          make -j "$(nproc)"

          test -s build/coreboot.rom

          mkdir -p ../firmware-out
          cp build/coreboot.rom ../firmware-out/coreboot.rom

          sha256sum ../firmware-out/coreboot.rom

      - name: Verify Coreboot ROM
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware-out/coreboot.rom
          ls -lh firmware-out/coreboot.rom

      - name: Upload Coreboot BIOS
        uses: actions/upload-artifact@v4
        with:
          name: catcore-coreboot-bios
          path: firmware-out/coreboot.rom
          if-no-files-found: error

  integration:
    name: End-to-End Coreboot Guest Boot Test
    needs: [engine, coreboot]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Download QEMU engine
        uses: actions/download-artifact@v4
        with:
          name: catcore-qemu-engine
          path: engine-out

      - name: Download Coreboot BIOS
        uses: actions/download-artifact@v4
        with:
          name: catcore-coreboot-bios
          path: firmware-out

      - name: Install NASM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm

      - name: Create x86 boot sector
        shell: bash
        run: |
          set -euo pipefail

          cat > boot.asm <<'ASM'
          BITS 16
          ORG 0x7c00

          start:
              cli
              xor ax, ax
              mov ds, ax
              mov ss, ax
              mov sp, 0x7c00

              mov dx, 0x3fb
              mov al, 0x80
              out dx, al

              mov dx, 0x3f8
              mov al, 0x01
              out dx, al

              mov dx, 0x3f9
              xor al, al
              out dx, al

              mov dx, 0x3fb
              mov al, 0x03
              out dx, al

              mov dx, 0x3fc
              mov al, 0x0b
              out dx, al

              mov si, message

          next_byte:
              lodsb
              test al, al
              jz halt

              mov dx, 0x3f8
              out dx, al
              jmp next_byte

          halt:
              hlt
              jmp halt

          message db 'CATCORE_GUEST_BOOT_OK', 13, 10, 0

          times 510 - ($ - $$) db 0
          dw 0xaa55
          ASM

          nasm -f bin boot.asm -o boot.bin

          test "$(stat -c %s boot.bin)" -eq 512

          truncate -s 16M boot.img
          dd if=boot.bin of=boot.img conv=notrunc status=none

      - name: Test Coreboot, Guest Boot and VNC
        shell: bash
        run: |
          set -euo pipefail

          E="$PWD/engine-out/libqemu-system-x86_64.so"
          BIOS="$PWD/firmware-out/coreboot.rom"

          test -s "$E"
          test -s "$BIOS"

          chmod +x "$E"

          "$E" \
            -machine pc \
            -accel tcg \
            -m 256 \
            -smp 1 \
            -nodefaults \
            -bios "$BIOS" \
            -drive file=boot.img,format=raw,if=ide \
            -boot c \
            -device VGA,romfile= \
            -serial file:guest-serial.log \
            -display none \
            -vnc 127.0.0.1:0 \
            -monitor none \
            > qemu.log 2>&1 &

          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          vnc_ok=0
          boot_ok=0

          for i in $(seq 1 90); do
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            if [ "$vnc_ok" -eq 0 ]; then
              if python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",5900),2); assert s.recv(12).startswith(b"RFB "); s.close()' 2>/dev/null; then
                vnc_ok=1
              fi
            fi

            if [ -f guest-serial.log ] && grep -Fq \
              'CATCORE_GUEST_BOOT_OK' guest-serial.log; then
              boot_ok=1
              break
            fi

            sleep 1
          done

          cat qemu.log || true
          cat guest-serial.log || true

          test "$vnc_ok" -eq 1 || {
            echo 'VNC handshake failed'
            exit 1
          }

          test "$boot_ok" -eq 1 || {
            echo 'Coreboot guest boot failed'
            exit 1
          }

          echo 'PASS: Coreboot + SeaBIOS + x86 guest boot + VNC'

  apk:
    name: Package CatCore APK
    needs: integration
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download QEMU engine
        uses: actions/download-artifact@v4
        with:
          name: catcore-qemu-engine
          path: app/src/main/jniLibs/arm64-v8a

      - name: Download Coreboot BIOS
        uses: actions/download-artifact@v4
        with:
          name: catcore-coreboot-bios
          path: app/src/main/assets/firmware

      - name: Add optional OVMF firmware
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq ovmf

          F=app/src/main/assets/firmware
          D=/usr/share/OVMF

          mkdir -p "$F"

          if [ -f "$D/OVMF_CODE_4M.fd" ]; then
            C="$D/OVMF_CODE_4M.fd"
            V="$D/OVMF_VARS_4M.fd"
          else
            C="$D/OVMF_CODE.fd"
            V="$D/OVMF_VARS.fd"
          fi

          cp -L "$C" "$F/OVMF_CODE.fd"
          cp -L "$V" "$F/OVMF_VARS.fd"

      - name: Verify firmware and engine
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/firmware/coreboot.rom

          test -s app/src/main/assets/firmware/OVMF_CODE.fd

          test -s app/src/main/assets/firmware/OVMF_VARS.fd

          test -s \
            app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so

      - name: Build CatCore APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify CatCore APK files
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"

          unzip -l "$APK" > apk-files.txt

          for f in \
            'lib/arm64-v8a/libqemu-system-x86_64.so' \
            'assets/firmware/coreboot.rom' \
            'assets/firmware/OVMF_CODE.fd' \
            'assets/firmware/OVMF_VARS.fd'; do

            grep -Fq "$f" apk-files.txt || {
              echo "Missing APK file: $f"
              exit 1
            }
          done

          cp "$APK" CatCore-debug.apk

      - name: Upload CatCore APK
        uses: actions/upload-artifact@v4
        with:
          name: CatCore-debug-apk
          path: CatCore-debug.apk
          if-no-files-found: error

      - name: Publish CatCore Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CatCore-debug.apk

# YAML and shell syntax checked in the sandbox.
# Full QEMU/firmware boot is tested by the GitHub integration job.
# This is not yet an Android runtime end-to-end test.
# The packaged engine is a Linux ARM64 executable.
# Running QEMU on Android still requires an Android-compatible
# engine and appropriate app-side process-launch integration.
